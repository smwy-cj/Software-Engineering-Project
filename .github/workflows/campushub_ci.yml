name: CampusHub CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campushub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: maven-

      - name: Install dependencies
        run: cd backend && mvn dependency:go-offline -B -q
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

      - name: Run static code analysis (Checkstyle)
        run: cd backend && mvn checkstyle:check -B -q || echo "Checkstyle passed with warnings"
        continue-on-error: true

      - name: Run unit tests
        run: cd backend && mvn test -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Run integration tests
        run: cd backend && mvn verify -B -Dit.test=*IntegrationTest
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: Build application
        run: cd backend && mvn package -DskipTests -B

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: campushub-jar
          path: backend/target/*.jar

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/target/surefire-reports/

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run lint
        run: cd frontend && npx eslint src/ --ext .js,.vue || echo "Lint passed with warnings"
        continue-on-error: true

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: campushub-frontend
          path: frontend/dist/
